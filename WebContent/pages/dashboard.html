<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard — FinTrack</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <style>
    *,*::before,*::after {
      box-sizing:border-box;
      margin:0;
      padding:0;
    }

    :root {
      --bg:#050a0e;
      --surface:#0d1b2a;
      --surface2:#112240;
      --surface3:#162d4a;
      --accent:#00d4ff;
      --accent2:#7b2fff;
      --gold:#f5c842;
      --green:#2ed573;
      --red:#ff4757;
      --orange:#ffa502;
      --text:#e8f4f8;
      --muted:#78909c;
      --border:rgba(0,212,255,.13);
      --sidebar:235px;
      --header:68px;
    }

    html,body {
      min-height:100%;
      font-family:'Outfit',sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    body {
      background:
        radial-gradient(ellipse at 10% 10%,rgba(0,212,255,.08),transparent 35%),
        radial-gradient(ellipse at 90% 90%,rgba(123,47,255,.09),transparent 35%),
        var(--bg);
    }

    /* APP LAYOUT */

    .app {
      display:grid;
      grid-template-columns:var(--sidebar) 1fr;
      grid-template-rows:var(--header) 1fr;
      min-height:100vh;
    }

    /* SIDEBAR */

    .sidebar {
      grid-row:1/3;
      background:rgba(13,27,42,.94);
      backdrop-filter:blur(20px);
      border-right:1px solid var(--border);
      display:flex;
      flex-direction:column;
      padding:1.5rem 1rem;
      position:relative;
      overflow:hidden;
      z-index:100;
    }

    .sidebar::before {
      content:'';
      position:absolute;
      bottom:-80px;
      left:-80px;
      width:220px;
      height:220px;
      background:radial-gradient(circle,rgba(123,47,255,.2),transparent 70%);
      pointer-events:none;
    }

    .brand {
      display:flex;
      align-items:center;
      gap:.8rem;
      padding:.5rem .5rem 2rem;
    }

    .brand-icon {
      width:40px;
      height:40px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      border-radius:12px;
      display:grid;
      place-items:center;
      font-size:1.4rem;
      font-weight:800;
      color:#050a0e;
      box-shadow:0 0 22px rgba(0,212,255,.25);
    }

    .brand-name {
      font-size:1.1rem;
      font-weight:800;
      color:var(--accent);
      letter-spacing:.12em;
    }

    .nav {
      display:flex;
      flex-direction:column;
      gap:.4rem;
    }

    .nav-item {
      display:flex;
      align-items:center;
      gap:.85rem;
      padding:.85rem .9rem;
      border-radius:11px;
      cursor:pointer;
      transition:all .25s ease;
      color:var(--muted);
      text-decoration:none;
      font-size:.9rem;
      font-weight:500;
    }

    .nav-item span {
      font-size:1.1rem;
    }

    .nav-item:hover {
      background:var(--surface2);
      color:var(--text);
      transform:translateX(3px);
    }

    .nav-item.active {
      background:linear-gradient(135deg,rgba(123,47,255,.25),rgba(0,212,255,.15));
      color:var(--accent);
      border:1px solid rgba(0,212,255,.2);
      box-shadow:0 0 18px rgba(0,212,255,.07);
    }

    .sidebar-footer {
      margin-top:auto;
      padding-top:1rem;
      border-top:1px solid var(--border);
    }

    .user-chip {
      display:flex;
      align-items:center;
      gap:.75rem;
      padding:.75rem;
    }

    .avatar {
      width:38px;
      height:38px;
      border-radius:50%;
      background:linear-gradient(135deg,var(--accent2),var(--accent));
      display:grid;
      place-items:center;
      font-weight:700;
      color:white;
      flex-shrink:0;
      box-shadow:0 0 15px rgba(0,212,255,.2);
    }

    .user-info {
      min-width:0;
    }

    .user-name {
      font-size:.875rem;
      font-weight:600;
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
    }

    .user-email {
      font-size:.7rem;
      color:var(--muted);
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
    }

    .logout-btn {
      display:flex;
      align-items:center;
      gap:.6rem;
      padding:.7rem .85rem;
      border-radius:9px;
      cursor:pointer;
      color:var(--muted);
      font-size:.85rem;
      transition:all .2s;
      border:none;
      background:none;
      font-family:'Outfit',sans-serif;
      width:100%;
    }

    .logout-btn:hover {
      color:var(--red);
      background:rgba(255,71,87,.08);
    }

    /* HEADER */

    .header {
      background:rgba(5,10,14,.85);
      backdrop-filter:blur(20px);
      border-bottom:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 2rem;
      position:sticky;
      top:0;
      z-index:10;
    }

    .header-left {
      display:flex;
      align-items:center;
      gap:.8rem;
    }

    .page-title {
      font-size:1.25rem;
      font-weight:700;
      letter-spacing:.02em;
    }

    .header-right {
      display:flex;
      align-items:center;
      gap:1rem;
    }

    .month-picker {
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:10px;
      color:var(--text);
      padding:.55rem .8rem;
      font-family:'Outfit',sans-serif;
      font-size:.875rem;
      cursor:pointer;
      outline:none;
      transition:border-color .2s;
    }

    .month-picker:focus {
      border-color:var(--accent);
    }

    .search-wrap {
  position:relative;
  display:flex;
  align-items:center;
}

.search-icon {
  position:absolute;
  left:.85rem;
  color:var(--muted);
  font-size:.9rem;
  pointer-events:none;
}

.search-box {
  background:var(--surface2);
  border:1px solid var(--border);
  border-radius:12px;
  color:var(--text);
  padding:.7rem 4.2rem .7rem 2.5rem;
  font-family:'Outfit',sans-serif;
  font-size:.875rem;
  outline:none;
  width:240px;
  transition:all .25s;
}

.search-box:focus {
  border-color:var(--accent);
  box-shadow:0 0 0 3px rgba(0,212,255,.12);
  width:280px;
}

.search-box::placeholder {
  color:var(--muted);
}

.search-clear {
  position:absolute;
  right:2.7rem;
  border:0;
  background:transparent;
  color:var(--muted);
  cursor:pointer;
  font-size:.8rem;
  display:none;
  padding:.3rem;
}

.search-clear:hover {
  color:var(--red);
}

.search-shortcut {
  position:absolute;
  right:.7rem;
  border:1px solid var(--border);
  border-radius:5px;
  color:var(--muted);
  font-size:.7rem;
  padding:.1rem .4rem;
  pointer-events:none;
}

    .menu-btn {
      display:none;
      background:none;
      border:0;
      color:var(--text);
      font-size:1.6rem;
      cursor:pointer;
    }

    /* MAIN */

    .main {
      overflow-y:auto;
      padding:2rem;
      display:flex;
      flex-direction:column;
      gap:1.75rem;
      min-width:0;
    }

    /* SECTION HEADING */

    .section-heading {
      font-size:1rem;
      font-weight:700;
      margin-bottom:1rem;
      display:flex;
      align-items:center;
      gap:.6rem;
    }

    .section-heading::before {
      content:'';
      width:3px;
      height:17px;
      background:linear-gradient(var(--accent2),var(--accent));
      border-radius:2px;
    }

    /* KPI CARDS */

    .kpi-grid {
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:1rem;
    }

    .kpi {
      background:linear-gradient(145deg,rgba(17,34,64,.9),rgba(13,27,42,.95));
      border:1px solid var(--border);
      border-radius:16px;
      padding:1.4rem;
      position:relative;
      overflow:hidden;
      transition:all .25s;
    }

    .kpi:hover {
      transform:translateY(-4px);
      border-color:rgba(0,212,255,.4);
      box-shadow:0 10px 30px rgba(0,212,255,.08);
    }

    .kpi::before {
      content:'';
      position:absolute;
      top:-30px;
      right:-30px;
      width:90px;
      height:90px;
      border-radius:50%;
      opacity:.15;
    }

    .kpi.blue::before {background:var(--accent)}
    .kpi.purple::before {background:var(--accent2)}
    .kpi.green::before {background:var(--green)}
    .kpi.orange::before {background:var(--orange)}

    .kpi-label {
      font-size:.75rem;
      text-transform:uppercase;
      letter-spacing:.1em;
      color:var(--muted);
      margin-bottom:.7rem;
    }

    .kpi-value {
      font-family:'JetBrains Mono',monospace;
      font-size:1.7rem;
      font-weight:600;
      margin-bottom:.4rem;
      position:relative;
      word-break:break-word;
    }

    .kpi-value.blue {color:var(--accent)}
    .kpi-value.purple {color:#a78bfa}
    .kpi-value.green {color:var(--green)}
    .kpi-value.red {color:var(--red)}
    .kpi-value.orange {color:var(--orange)}

    .kpi-sub {
      font-size:.75rem;
      color:var(--muted);
    }

    .kpi-icon {
      position:absolute;
      top:1.2rem;
      right:1.2rem;
      font-size:1.5rem;
      opacity:.65;
    }

    /* BUDGET BAR */

    .budget-bar-wrap {
      margin:.9rem 0 .3rem;
    }

    .budget-bar-track {
      height:7px;
      background:var(--surface2);
      border-radius:10px;
      overflow:hidden;
    }

    .budget-bar-fill {
      height:100%;
      border-radius:10px;
      transition:width .8s ease;
      background:linear-gradient(90deg,var(--accent2),var(--accent));
    }

    .budget-bar-fill.warn {
      background:linear-gradient(90deg,var(--orange),var(--gold));
    }

    .budget-bar-fill.over {
      background:linear-gradient(90deg,var(--red),#ff6b7a);
    }

    /* CHARTS */

    .charts-row {
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:1.25rem;
    }

    .chart-card {
      background:linear-gradient(145deg,rgba(17,34,64,.9),rgba(13,27,42,.95));
      border:1px solid var(--border);
      border-radius:16px;
      padding:1.5rem;
      transition:border-color .25s;
      min-width:0;
    }

    .chart-card:hover {
      border-color:rgba(0,212,255,.28);
    }

    .chart-title {
      font-size:1rem;
      font-weight:700;
      margin-bottom:1.25rem;
      display:flex;
      align-items:center;
      gap:.6rem;
    }

    .chart-title::before {
      content:'';
      width:3px;
      height:16px;
      background:linear-gradient(var(--accent2),var(--accent));
      border-radius:2px;
    }

    .chart-wrap {
      position:relative;
      height:250px;
      width:100%;
    }

    /* CATEGORY CARDS */

    .cat-grid {
      display:grid;
      grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
      gap:.875rem;
    }

    .cat-card {
      background:linear-gradient(145deg,rgba(17,34,64,.9),rgba(13,27,42,.95));
      border:1px solid var(--border);
      border-radius:14px;
      padding:1.1rem;
      transition:all .25s;
      position:relative;
      overflow:hidden;
    }

    .cat-card:hover {
      transform:translateY(-3px);
      border-color:rgba(0,212,255,.35);
    }

    .cat-header {
      display:flex;
      align-items:center;
      gap:.6rem;
      margin-bottom:.75rem;
    }

    .cat-dot {
      width:10px;
      height:10px;
      border-radius:50%;
      flex-shrink:0;
    }

    .cat-name {
      font-size:.85rem;
      font-weight:600;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .cat-amount {
      font-family:'JetBrains Mono',monospace;
      font-size:1.15rem;
      font-weight:600;
      margin-bottom:.5rem;
    }

    .cat-bar-wrap {
      height:5px;
      background:var(--surface2);
      border-radius:5px;
      overflow:hidden;
    }

    .cat-bar {
      height:100%;
      border-radius:5px;
      transition:width .6s ease;
    }

    .cat-footer {
      display:flex;
      justify-content:space-between;
      gap:.5rem;
      margin-top:.5rem;
    }

    .cat-txn,.cat-budget {
      font-size:.7rem;
      color:var(--muted);
    }

    .cat-over {
      color:var(--red)!important;
    }

    /* EXPENSE TABLE */

    .table-container {
      width:100%;
      overflow-x:auto;
    }

    .expense-table {
      width:100%;
      border-collapse:collapse;
      min-width:520px;
    }

    .expense-table th {
      font-size:.7rem;
      text-transform:uppercase;
      letter-spacing:.1em;
      color:var(--accent);
      text-align:left;
      padding:.8rem 1rem;
      border-bottom:1px solid var(--border);
    }

    .expense-table td {
      padding:.9rem 1rem;
      border-bottom:1px solid rgba(255,255,255,.05);
      font-size:.875rem;
      vertical-align:middle;
    }

    .expense-table tr:hover td {
      background:rgba(0,212,255,.04);
    }

    .expense-table tr:last-child td {
      border-bottom:none;
    }

    .exp-title {
      font-weight:600;
    }

    .exp-cat {
      display:inline-flex;
      align-items:center;
      gap:.4rem;
      font-size:.78rem;
      background:rgba(255,255,255,.06);
      border-radius:6px;
      padding:.3rem .6rem;
      white-space:nowrap;
    }

    .amount-cell {
      font-family:'JetBrains Mono',monospace;
      color:var(--red);
      font-weight:600;
      white-space:nowrap;
    }

    .badge {
      display:inline-block;
      padding:.2rem .6rem;
      border-radius:6px;
      font-size:.7rem;
      font-weight:600;
      text-transform:capitalize;
    }

    .badge-cash {
      background:rgba(245,200,66,.12);
      color:var(--gold);
    }

    .badge-card {
      background:rgba(0,212,255,.12);
      color:var(--accent);
    }

    .badge-upi {
      background:rgba(46,213,115,.12);
      color:var(--green);
    }

    .badge-netbanking {
      background:rgba(123,47,255,.12);
      color:#b69aff;
    }

    .badge-other {
      background:rgba(90,122,138,.12);
      color:var(--muted);
    }

    /* EMPTY AND LOADING */

    .empty {
      text-align:center;
      padding:3rem 1rem;
      color:var(--muted);
      font-size:.95rem;
    }

    .spinner {
      width:34px;
      height:34px;
      border:3px solid var(--surface2);
      border-top-color:var(--accent);
      border-radius:50%;
      animation:spin .7s linear infinite;
      margin:3rem auto;
    }

    @keyframes spin {
      to {transform:rotate(360deg)}
    }

    .error-message {
      background:rgba(255,71,87,.08);
      border:1px solid rgba(255,71,87,.2);
      color:#ff7b87;
      padding:1rem;
      border-radius:12px;
      text-align:center;
    }

    /* SCROLLBAR */

    ::-webkit-scrollbar {
      width:6px;
    }

    ::-webkit-scrollbar-track {
      background:transparent;
    }

    ::-webkit-scrollbar-thumb {
      background:var(--surface2);
      border-radius:3px;
    }

    /* MOBILE */

    .overlay {
      display:none;
    }

    @media(max-width:1050px) {
      .kpi-grid {
        grid-template-columns:repeat(2,1fr);
      }
    }

    @media(max-width:768px) {
      .app {
  grid-template-columns:1fr;
  grid-template-rows:auto 1fr;
  min-height:100dvh;
}

      .sidebar {
        position:fixed;
        top:0;
        left:0;
        bottom:0;
        width:250px;
        transform:translateX(-100%);
        transition:transform .3s ease;
      }

      .sidebar.open {
        transform:translateX(0);
      }

      .overlay.show {
        display:block;
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.65);
        z-index:90;
      }

      .menu-btn {
        display:block;
      }

     .header {
  padding:.75rem 1rem;
  flex-direction:column;
  align-items:stretch;
  gap:.65rem;
}

      .page-title {
        font-size:1.05rem;
      }

      .header-right {
  width:100%;
  display:flex;
  flex-wrap:wrap;
  gap:.5rem;
}

.header-left {
  width:100%;
}

      .search-wrap {
  display:flex;
  width:100%;
  flex:1;
}

.search-box,
.search-box:focus {
  width:100%;
}

      .month-picker {
        max-width:145px;
        font-size:.75rem;
        padding:.45rem;
      }

      .main {
        padding:1rem;
        gap:1.25rem;
      }

      .kpi-grid {
        grid-template-columns:1fr 1fr;
        gap:.75rem;
      }

      .kpi {
        padding:1rem;
      }

      .kpi-value {
        font-size:1.3rem;
      }

      .kpi-icon {
        font-size:1.2rem;
        top:1rem;
        right:1rem;
      }

      .charts-row {
        grid-template-columns:1fr;
      }

      .chart-card {
        padding:1rem;
      }

      .chart-wrap {
        height:220px;
      }

      .cat-grid {
        grid-template-columns:1fr 1fr;
      }
    }

    @media(max-width:400px) {
      .kpi-grid {
        grid-template-columns:1fr;
      }

      .cat-grid {
        grid-template-columns:1fr;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- MOBILE OVERLAY -->
  <div class="overlay" id="overlay" onclick="toggleMenu()"></div>

  <!-- SIDEBAR -->
  <aside class="sidebar">

    <div class="brand">
      <div class="brand-icon">✦</div>
      <div class="brand-name">FINTRACK</div>
    </div>

    <nav class="nav">
      <a class="nav-item active" href="dashboard.html">
        <span>📊</span> Dashboard
      </a>

      <a class="nav-item" href="expenses.html">
        <span>📝</span> Expenses
      </a>

      <a class="nav-item" href="categories.html">
        <span>🏷️</span> Categories
      </a>

      <a class="nav-item" href="analytics.html">
        <span>📈</span> Analytics
      </a>
    </nav>

    <div class="sidebar-footer">

      <div class="user-chip">
        <div class="avatar" id="sideAvatar">U</div>

        <div class="user-info">
          <div class="user-name" id="sideUserName">Loading...</div>
          <div class="user-email" id="sideEmail">—</div>
        </div>
      </div>

      <button class="logout-btn" onclick="logout()">
        ⇠ Sign Out
      </button>

    </div>
  </aside>

  <!-- HEADER -->
  <header class="header">

    <div class="header-left">
      <button class="menu-btn" onclick="toggleMenu()">☰</button>
      <div class="page-title">Dashboard</div>
    </div>

    <div class="header-right">

      <input
              type="month"
              class="month-picker"
              id="monthPicker"
      />

      <div class="search-wrap">
        <span class="search-icon">🔍</span>

        <input
                class="search-box"
                id="searchBox"
                type="text"
                placeholder="Search expenses..."
                autocomplete="off"
                oninput="liveSearch(this.value)"
        />

        <button
                class="search-clear"
                id="searchClear"
                type="button"
                onclick="clearSearch()"
                aria-label="Clear search">
          ✕
        </button>

        <span class="search-shortcut">/</span>
      </div>

    </div>
  </header>

  <!-- MAIN CONTENT -->
  <main class="main" id="mainContent">
    <div class="spinner"></div>
  </main>

</div>

<script>

  // STATE

  let currentUser = null;
  let allExpenses = [];
  let categories = [];

  let trendChart = null;
  let donutChart = null;
  let searchTimer;
let searchRequestId = 0;


  // INITIALIZATION

  (async function init() {

    try {

      const auth = await api('/api/auth?action=me');

      if (!auth || !auth.auth) {
        window.location.href = 'login.html';
        return;
      }

      currentUser = auth;

      const now = new Date();

      const monthStr =
        `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

      document.getElementById('monthPicker').value = monthStr;

      document
        .getElementById('monthPicker')
        .addEventListener('change', loadDashboard);

      document.getElementById('sideUserName').textContent =
        auth.name || 'User';

      document.getElementById('sideEmail').textContent =
        auth.email || '';

      document.getElementById('sideAvatar').textContent =
        (auth.name || 'U')[0].toUpperCase();

      await loadDashboard();

    } catch(error) {

      console.error('Initialization error:', error);

      document.getElementById('mainContent').innerHTML =
        '<div class="error-message">Unable to load dashboard. Please refresh the page.</div>';

    }

  })();


  // LOAD DASHBOARD

  async function loadDashboard() {

    const monthValue = document.getElementById('monthPicker').value;
    searchRequestId++;
clearTimeout(searchTimer);

    if (!monthValue) return;

    const [year, month] = monthValue.split('-');

    document.getElementById('mainContent').innerHTML =
      '<div class="spinner"></div>';

    try {

      const [overview, summary, trend, expenses] = await Promise.all([

        api(`/api/analytics?type=overview&year=${year}&month=${month}`),

        api(`/api/analytics?type=summary&year=${year}&month=${month}`),

        api('/api/analytics?type=trend'),

        api(`/api/expenses?month=${year}-${month}`)

      ]);

      allExpenses = Array.isArray(expenses) ? expenses : [];

      categories = Array.isArray(summary) ? summary : [];

      renderDashboard(
        overview || {},
        categories,
        trend || {},
        allExpenses
      );

    } catch(error) {

      console.error('Dashboard loading error:', error);

      document.getElementById('mainContent').innerHTML =
        '<div class="error-message">Something went wrong while loading dashboard.</div>';

    }

  }


  // RENDER DASHBOARD

  function renderDashboard(ov, cats, trend, expenses) {

    const fmt = n =>
      '₹' + Number(n || 0).toLocaleString('en-IN', {
        minimumFractionDigits:0,
        maximumFractionDigits:0
      });

    const pct = Number(ov.percentUsed || 0);

    document.getElementById('mainContent').innerHTML = `

      <!-- KPI CARDS -->

      <div class="kpi-grid">

        <div class="kpi blue">

          <div class="kpi-icon">💸</div>

          <div class="kpi-label">Month Spent</div>

          <div class="kpi-value blue">
            ${fmt(ov.monthlyTotal)}
          </div>

          <div class="kpi-sub">
            ${pct}% of budget used
          </div>

        </div>


        <div class="kpi purple">

          <div class="kpi-icon">🎯</div>

          <div class="kpi-label">Monthly Budget</div>

          <div class="kpi-value purple">
            ${fmt(ov.monthlyBudget)}
          </div>

          <div class="budget-bar-wrap">

            <div class="budget-bar-track">

              <div
                class="budget-bar-fill ${pct > 100 ? 'over' : pct > 75 ? 'warn' : ''}"
                style="width:${Math.min(Math.max(pct,0),100)}%"
              ></div>

            </div>

          </div>

        </div>


        <div class="kpi green">

          <div class="kpi-icon">💰</div>

          <div class="kpi-label">Remaining</div>

          <div class="kpi-value ${Number(ov.remaining) < 0 ? 'red' : 'green'}">
            ${fmt(ov.remaining)}
          </div>

          <div class="kpi-sub">
            ${Number(ov.remaining) < 0 ? '⚠ Over budget' : '✓ On track'}
          </div>

        </div>


        <div class="kpi orange">

          <div class="kpi-icon">📋</div>

          <div class="kpi-label">Transactions</div>

          <div class="kpi-value orange">
            ${expenses.length}
          </div>

          <div class="kpi-sub">
            This month
          </div>

        </div>

      </div>


      <!-- CHARTS -->

      <div class="charts-row">

        <div class="chart-card">

          <div class="chart-title">
            12-Month Spending Trend
          </div>

          <div class="chart-wrap">
            <canvas id="trendChart"></canvas>
          </div>

        </div>


        <div class="chart-card">

          <div class="chart-title">
            Category Breakdown
          </div>

          <div class="chart-wrap">
            <canvas id="donutChart"></canvas>
          </div>

        </div>

      </div>


      <!-- CATEGORY SUMMARY -->

      <div>

        <div class="section-heading">
          Category Summary
        </div>

        <div class="cat-grid" id="catGrid"></div>

      </div>


      <!-- RECENT EXPENSES -->

      <div class="chart-card">

        <div class="chart-title">
          Recent Expenses
        </div>

        <div id="expTable"></div>

      </div>

    `;

    renderTrendChart(trend);

    renderDonut(cats);

    renderCategoryCards(cats);

    renderExpenseTable(expenses.slice(0,15));

  }


  // TREND CHART

  function renderTrendChart(trend) {

    const ctx = document.getElementById('trendChart');

    if (!ctx) return;

    if (trendChart) {
      trendChart.destroy();
      trendChart = null;
    }

    trendChart = new Chart(ctx, {

      type:'line',

      data: {

        labels: trend.labels || [],

        datasets:[{

          label:'Spending',

          data:trend.values || [],

          borderColor:'#00d4ff',

          backgroundColor:'rgba(0,212,255,.10)',

          fill:true,

          borderWidth:2,

          tension:.4,

          pointBackgroundColor:'#00d4ff',

          pointBorderColor:'#050a0e',

          pointBorderWidth:2,

          pointRadius:4,

          pointHoverRadius:7

        }]

      },

      options: {

        responsive:true,

        maintainAspectRatio:false,

        plugins: {

          legend: {
            display:false
          },

          tooltip: {

            callbacks: {

              label:v =>
                '₹' + Number(v.raw).toLocaleString('en-IN')

            }

          }

        },

        scales: {

          x: {

            grid: {
              color:'rgba(255,255,255,.05)'
            },

            ticks: {
              color:'#78909c',
              font:{size:10}
            }

          },

          y: {

            beginAtZero:true,

            grid: {
              color:'rgba(255,255,255,.05)'
            },

            ticks: {

              color:'#78909c',

              font:{size:10},

              callback:v =>
                '₹' + Number(v).toLocaleString('en-IN')

            }

          }

        }

      }

    });

  }


  // DONUT CHART

  function renderDonut(cats) {

    const ctx = document.getElementById('donutChart');

    if (!ctx) return;

    if (donutChart) {
      donutChart.destroy();
      donutChart = null;
    }

    const active = cats.filter(c =>
      Number(c.totalSpent || 0) > 0
    );

    if (!active.length) {

      ctx.parentElement.innerHTML =
        '<div class="empty">No category spending data available</div>';

      return;

    }

    donutChart = new Chart(ctx, {

      type:'doughnut',

      data: {

        labels:active.map(c => c.name),

        datasets:[{

          data:active.map(c => Number(c.totalSpent)),

          backgroundColor:active.map(c => c.color || '#00d4ff'),

          borderWidth:0,

          hoverOffset:8

        }]

      },

      options: {

        responsive:true,

        maintainAspectRatio:false,

        cutout:'68%',

        plugins: {

          legend: {

            position:'right',

            labels: {

              color:'#e8f4f8',

              font:{size:11},

              boxWidth:12,

              padding:14

            }

          },

          tooltip: {

            callbacks: {

              label:v =>
                `${v.label}: ₹${Number(v.raw).toLocaleString('en-IN')}`

            }

          }

        }

      }

    });

  }


  // CATEGORY CARDS

  function renderCategoryCards(cats) {

    const fmt = n =>
      '₹' + Number(n || 0).toLocaleString('en-IN');

    const grid = document.getElementById('catGrid');

    if (!grid) return;

    if (!cats.length) {

      grid.innerHTML =
        '<div class="empty">No categories available</div>';

      return;

    }

    grid.innerHTML = cats.map(c => {

      const spent = Number(c.totalSpent || 0);

      const limit = Number(c.budgetLimit || 0);

      const pct = limit > 0
        ? Math.min(100,(spent/limit)*100)
        : 0;

      const over = limit > 0 && spent > limit;

      const color = c.color || '#00d4ff';

      return `

        <div class="cat-card">

          <div class="cat-header">

            <div
              class="cat-dot"
              style="background:${color}"
            ></div>

            <div class="cat-name">
              ${c.name || 'Other'}
            </div>

          </div>

          <div
            class="cat-amount"
            style="color:${color}"
          >
            ${fmt(spent)}
          </div>

          ${limit > 0 ? `

            <div class="cat-bar-wrap">

              <div
                class="cat-bar"
                style="width:${pct}%;background:${over ? '#ff4757' : color}"
              ></div>

            </div>

            <div class="cat-footer">

              <span class="cat-txn">
                ${c.txnCount || 0} txns
              </span>

              <span class="cat-budget ${over ? 'cat-over' : ''}">
                of ${fmt(limit)}
              </span>

            </div>

          ` : `

            <div class="cat-txn">
              ${c.txnCount || 0} transactions
            </div>

          `}

        </div>

      `;

    }).join('');

  }


  // EXPENSE TABLE

  function renderExpenseTable(expenses) {

    const wrap = document.getElementById('expTable');

    if (!wrap) return;

    if (!expenses.length) {

      wrap.innerHTML =
        '<div class="empty">No expenses found</div>';

      return;

    }

    wrap.innerHTML = `

      <div class="table-container">

        <table class="expense-table">

          <thead>

            <tr>
              <th>Title</th>
              <th>Category</th>
              <th>Date</th>
              <th>Mode</th>
              <th>Amount</th>
            </tr>

          </thead>

          <tbody>

            ${expenses.map(e => {

              const mode = String(e.paymentMode || 'other')
                .toLowerCase()
                .replace(/[^a-z0-9_-]/g,'');

              return `

                <tr>

                  <td class="exp-title">
                    ${e.title || 'Untitled'}
                  </td>

                  <td>

                    <span class="exp-cat">

                      <span
                        style="
                          width:8px;
                          height:8px;
                          border-radius:50%;
                          background:${e.categoryColor || '#888'};
                          display:inline-block;
                        "
                      ></span>

                      ${e.categoryName || '—'}

                    </span>

                  </td>

                  <td style="color:var(--muted)">
                    ${formatDate(e.expenseDate)}
                  </td>

                  <td>
                    <span class="badge badge-${mode}">
                      ${e.paymentMode || 'Other'}
                    </span>
                  </td>

                  <td class="amount-cell">
                    −₹${Number(e.amount || 0).toLocaleString('en-IN')}
                  </td>

                </tr>

              `;

            }).join('')}

          </tbody>

        </table>

      </div>

    `;

  }


  // LIVE SEARCH

  function liveSearch(q) {

  const clearBtn = document.getElementById('searchClear');

  clearBtn.style.display = q.trim() ? 'block' : 'none';

  clearTimeout(searchTimer);

  if (!q.trim()) {

    searchRequestId++;

    renderExpenseTable(allExpenses.slice(0, 15));

    return;

  }

  searchTimer = setTimeout(async () => {

    const requestId = ++searchRequestId;

    try {

      const res = await api(
        `/api/expenses?q=${encodeURIComponent(q)}`
      );

      if (
        requestId !== searchRequestId ||
        q !== document.getElementById('searchBox').value
      ) {
        return;
      }

      if (Array.isArray(res)) {

        renderExpenseTable(res.slice(0, 15));

      }

    } catch(error) {

      console.error('Search error:', error);

    }

  }, 300);

}


function clearSearch() {

  const box = document.getElementById('searchBox');

  box.value = '';

  liveSearch('');

  box.focus();

}



  // DATE FORMAT

  function formatDate(d) {

    if (!d) return '—';

    return new Date(d).toLocaleDateString('en-IN', {

      day:'2-digit',

      month:'short',

      year:'numeric'

    });

  }


  // API FUNCTION

  async function api(url) {

    try {

      const r = await fetch(url);

      if (!r.ok) {
        throw new Error('API request failed: ' + r.status);
      }

      return await r.json();

    } catch(error) {

      console.error('API Error:',url,error);

      return {};

    }

  }


  // LOGOUT

  async function logout() {

    try {

      await fetch('/api/auth?action=logout', {
        method:'POST'
      });

    } catch(error) {

      console.error('Logout error:',error);

    }

    window.location.href = 'login.html';

  }


  // MOBILE MENU

  function toggleMenu() {

    document
      .querySelector('.sidebar')
      .classList.toggle('open');

    document
      .getElementById('overlay')
      .classList.toggle('show');

  }
  document.addEventListener('keydown', function(e) {

  const searchBox = document.getElementById('searchBox');

  if (
    e.key === '/' &&
    !['INPUT', 'TEXTAREA'].includes(document.activeElement.tagName)
  ) {

    e.preventDefault();

    searchBox.focus();

  }

  if (
    e.key === 'Escape' &&
    document.activeElement.id === 'searchBox'
  ) {

    clearSearch();

  }

});

</script>

</body>
