<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Analytics — FinTrack</title>

  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>

  <style>
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

    :root{
      --bg:#050a0e;
      --surface:#0d1b2a;
      --surface2:#112240;
      --surface3:#162d4a;
      --accent:#00d4ff;
      --accent2:#7b2fff;
      --green:#2ed573;
      --red:#ff4757;
      --gold:#f5c842;
      --orange:#ffa502;
      --text:#e8f4f8;
      --muted:#5a7a8a;
      --border:rgba(0,212,255,.12);
      --sidebar:220px;
      --header:64px;
    }

    html,body{
      min-height:100%;
      height:auto;
      font-family:'Outfit',sans-serif;
      background:var(--bg);
      color:var(--text);
      overflow-x:hidden;
      overflow-y:auto;
    }

    body{
      background:
        radial-gradient(ellipse at 80% 0%,rgba(0,212,255,.04),transparent 40%),
        var(--bg);
    }

    .app{
      display:grid;
      grid-template-columns:var(--sidebar) minmax(0,1fr);
      grid-template-rows:var(--header) auto;
      min-height:100vh;
      height:auto;
    }

    .sidebar{
      grid-row:1/3;
      background:var(--surface);
      border-right:1px solid var(--border);
      display:flex;
      flex-direction:column;
      padding:1.5rem 1rem;
      position:relative;
      overflow:hidden;
      min-height:100%;
    }

    .sidebar::before{
      content:'';
      position:absolute;
      bottom:-80px;
      left:-80px;
      width:200px;
      height:200px;
      background:radial-gradient(circle,rgba(123,47,255,.15) 0%,transparent 70%);
      pointer-events:none;
    }

    .brand{
      display:flex;
      align-items:center;
      gap:.75rem;
      padding:.5rem .5rem 1.5rem;
    }

    .brand-icon{
      width:36px;
      height:36px;
      background:linear-gradient(135deg,var(--accent),var(--accent2));
      border-radius:10px;
      display:grid;
      place-items:center;
      font-size:1.1rem;
    }

    .brand-name{
      font-size:.95rem;
      font-weight:700;
      color:var(--accent);
      letter-spacing:.08em;
    }

    .nav{
      display:flex;
      flex-direction:column;
      gap:.25rem;
    }

    .nav-item{
      display:flex;
      align-items:center;
      gap:.75rem;
      padding:.75rem .85rem;
      border-radius:11px;
      cursor:pointer;
      transition:all .2s;
      color:var(--muted);
      text-decoration:none;
      font-size:.9rem;
      font-weight:500;
    }

    .nav-item:hover{
      background:var(--surface2);
      color:var(--text);
    }

    .nav-item.active{
      background:linear-gradient(135deg,rgba(123,47,255,.25),rgba(0,212,255,.15));
      color:var(--accent);
      border:1px solid rgba(0,212,255,.2);
    }

    .sidebar-footer{
      margin-top:auto;
      padding-top:1rem;
      border-top:1px solid var(--border);
    }

    .user-chip{
      display:flex;
      align-items:center;
      gap:.75rem;
      padding:.75rem;
      min-width:0;
    }

    .avatar{
      width:36px;
      height:36px;
      border-radius:50%;
      background:linear-gradient(135deg,var(--accent2),var(--accent));
      display:grid;
      place-items:center;
      font-weight:700;
      font-size:.85rem;
      flex-shrink:0;
    }

    .user-name{
      font-size:.875rem;
      font-weight:600;
    }

    .user-email{
      font-size:.7rem;
      color:var(--muted);
      overflow:hidden;
      white-space:nowrap;
      text-overflow:ellipsis;
      max-width:130px;
    }

    .logout-btn{
      display:flex;
      align-items:center;
      gap:.5rem;
      padding:.6rem .85rem;
      border-radius:9px;
      cursor:pointer;
      color:var(--muted);
      font-size:.85rem;
      transition:all .2s;
      border:none;
      background:none;
      font-family:'Outfit',sans-serif;
      width:100%;
    }

    .logout-btn:hover{
      color:var(--red);
      background:rgba(255,71,87,.08);
    }

    .header{
      background:rgba(13,27,42,.85);
      backdrop-filter:blur(20px);
      border-bottom:1px solid var(--border);
      display:flex;
      align-items:center;
      justify-content:space-between;
      padding:0 2rem;
      position:sticky;
      top:0;
      z-index:10;
      min-width:0;
    }

    .header-left{
      display:flex;
      align-items:center;
      gap:.75rem;
    }

    .page-title{
      font-size:1.1rem;
      font-weight:700;
    }

    .month-picker{
      background:var(--surface2);
      border:1px solid var(--border);
      border-radius:10px;
      color:var(--text);
      padding:.55rem .8rem;
      font-family:'Outfit',sans-serif;
      font-size:.875rem;
      outline:none;
      cursor:pointer;
      color-scheme:dark;
    }

    .main{
      min-width:0;
      min-height:calc(100vh - var(--header));
      padding:2rem;
      display:flex;
      flex-direction:column;
      gap:1.5rem;
    }

    .insights-grid{
      display:grid;
      grid-template-columns:repeat(3,minmax(0,1fr));
      gap:1rem;
    }

    .insight-card{
      background:linear-gradient(145deg,var(--surface),rgba(17,34,64,.75));
      border:1px solid var(--border);
      border-radius:16px;
      padding:1.4rem;
      position:relative;
      overflow:hidden;
      transition:transform .25s,border-color .25s;
    }

    .insight-card:hover{
      transform:translateY(-3px);
      border-color:rgba(0,212,255,.3);
    }

    .insight-card::after{
      content:'';
      position:absolute;
      top:-25px;
      right:-25px;
      width:90px;
      height:90px;
      border-radius:50%;
      opacity:.09;
    }

    .insight-card.i1::after{background:var(--accent)}
    .insight-card.i2::after{background:var(--green)}
    .insight-card.i3::after{background:var(--gold)}

    .insight-label{
      font-size:.72rem;
      text-transform:uppercase;
      letter-spacing:.1em;
      color:var(--muted);
      margin-bottom:.6rem;
    }

    .insight-val{
      font-family:'JetBrains Mono',monospace;
      font-size:1.45rem;
      font-weight:600;
      margin-bottom:.35rem;
      overflow-wrap:anywhere;
    }

    .insight-sub{
      font-size:.78rem;
      color:var(--muted);
    }

    .charts-full{
      display:grid;
      grid-template-columns:minmax(0,2fr) minmax(0,1fr);
      gap:1.25rem;
    }

    .chart-card{
      background:var(--surface);
      border:1px solid var(--border);
      border-radius:16px;
      padding:1.5rem;
      min-width:0;
      transition:border-color .2s;
    }

    .chart-card:hover{
      border-color:rgba(0,212,255,.25);
    }

    .chart-title{
      font-size:.9rem;
      font-weight:700;
      margin-bottom:1.25rem;
      display:flex;
      align-items:center;
      gap:.6rem;
    }

    .chart-title::before{
      content:'';
      width:3px;
      height:17px;
      background:linear-gradient(var(--accent2),var(--accent));
      border-radius:2px;
    }

    .chart-wrap{
      position:relative;
      height:280px;
      width:100%;
    }

    .chart-tall{
      height:340px;
    }

    .cat-list{
      display:flex;
      flex-direction:column;
      gap:.9rem;
      max-height:280px;
      overflow-y:auto;
      padding-right:.5rem;
    }

    .cat-row{
      display:flex;
      align-items:center;
      gap:.75rem;
      min-width:0;
    }

    .cat-row-dot{
      width:10px;
      height:10px;
      border-radius:50%;
      flex-shrink:0;
    }

    .cat-row-name{
      flex:1;
      min-width:0;
      font-size:.85rem;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .cat-row-bar-wrap{
      width:80px;
      height:6px;
      background:var(--surface2);
      border-radius:3px;
      overflow:hidden;
      flex-shrink:0;
    }

    .cat-row-bar{
      height:100%;
      border-radius:3px;
    }

    .cat-row-val{
      font-family:'JetBrains Mono',monospace;
      font-size:.78rem;
      min-width:70px;
      text-align:right;
    }

    .empty-state{
      min-height:220px;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      text-align:center;
      color:var(--muted);
      gap:.6rem;
      font-size:.85rem;
    }

    .empty-icon{
      font-size:2rem;
      opacity:.7;
    }

    .spinner{
      width:30px;
      height:30px;
      border:3px solid var(--surface2);
      border-top-color:var(--accent);
      border-radius:50%;
      animation:spin .7s linear infinite;
      margin:3rem auto;
    }

    @keyframes spin{
      to{transform:rotate(360deg)}
    }

    ::-webkit-scrollbar{width:5px}
    ::-webkit-scrollbar-track{background:transparent}
    ::-webkit-scrollbar-thumb{
      background:var(--surface3);
      border-radius:5px;
    }

    .menu-btn{
      display:none;
      background:none;
      border:0;
      color:var(--text);
      font-size:1.6rem;
      cursor:pointer;
      line-height:1;
    }

    .menu-overlay{display:none}

    @media(max-width:1000px){
      .charts-full{
        grid-template-columns:1fr;
      }
    }

    @media(max-width:768px){
      .app{
        grid-template-columns:1fr;
        grid-template-rows:var(--header) auto;
        min-height:100vh;
        height:auto;
      }

      .sidebar{
        position:fixed;
        top:0;
        left:0;
        bottom:0;
        width:240px;
        min-height:100%;
        z-index:90;
        transform:translateX(-100%);
        transition:transform .3s;
      }

      .sidebar.open{
        transform:translateX(0);
      }

      .menu-overlay.show{
        display:block;
        position:fixed;
        inset:0;
        background:rgba(0,0,0,.65);
        z-index:80;
      }

      .menu-btn{display:block}

      .header{
        padding:0 1rem;
        gap:.5rem;
      }

      .page-title{font-size:1rem}

      .main{
        min-height:calc(100vh - var(--header));
        padding:1rem;
        gap:1rem;
      }

      .insights-grid{
        grid-template-columns:1fr;
      }

      .charts-full{
        grid-template-columns:1fr;
        gap:1rem;
      }

      .chart-card{padding:1rem}

      .chart-wrap,.chart-tall{height:260px}

      .cat-row-bar-wrap{width:50px}
    }

    @media(max-width:380px){
      .month-picker{
        max-width:145px;
        font-size:.78rem;
        padding:.5rem;
      }

      .page-title{font-size:.9rem}

      .cat-row-val{
        min-width:58px;
        font-size:.7rem;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <div class="menu-overlay" id="menuOverlay" onclick="toggleMenu()"></div>

  <aside class="sidebar">

    <div class="brand">
      <div class="brand-icon">💰</div>
      <div class="brand-name">FINTRACK</div>
    </div>

    <nav class="nav">
      <a class="nav-item" href="dashboard.html"><span>📊</span> Dashboard</a>
      <a class="nav-item" href="expenses.html"><span>📝</span> Expenses</a>
      <a class="nav-item" href="categories.html"><span>🏷️</span> Categories</a>
      <a class="nav-item active" href="analytics.html"><span>📈</span> Analytics</a>
    </nav>

    <div class="sidebar-footer">

      <div class="user-chip">
        <div class="avatar" id="sideAvatar">U</div>
        <div>
          <div class="user-name" id="sideUserName">—</div>
          <div class="user-email" id="sideEmail">—</div>
        </div>
      </div>

      <button class="logout-btn" onclick="logout()">⇠ Sign Out</button>

    </div>
  </aside>

  <header class="header">

    <div class="header-left">
      <button class="menu-btn" onclick="toggleMenu()">☰</button>
      <div class="page-title">Analytics</div>
    </div>

    <input type="month" class="month-picker" id="monthPicker"/>

  </header>

  <main class="main" id="main">
    <div class="spinner"></div>
  </main>

</div>

<script>
  let trendChart = null;
  let donutChart = null;
  let barChart = null;

  const fmt = n => '₹' + Number(n || 0).toLocaleString('en-IN',{
    maximumFractionDigits:0
  });

  (async function(){

    try{

      const auth = await api('/api/auth?action=me');

      if(!auth || !auth.auth){
        window.location.href='login.html';
        return;
      }

      document.getElementById('sideUserName').textContent = auth.name || 'User';
      document.getElementById('sideEmail').textContent = auth.email || '';
      document.getElementById('sideAvatar').textContent =
        (auth.name || 'U').charAt(0).toUpperCase();

      const now = new Date();

      const mp = document.getElementById('monthPicker');

      mp.value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

      mp.addEventListener('change',load);

      await load();

    }catch(error){

      console.error('Authentication error:',error);

      document.getElementById('main').innerHTML =
        '<div class="empty-state">Unable to load analytics. Please refresh the page.</div>';

    }

  })();


  async function load(){

    const monthValue = document.getElementById('monthPicker').value;

    if(!monthValue) return;

    const [y,m] = monthValue.split('-');

    document.getElementById('main').innerHTML =
      '<div class="spinner"></div>';

    try{

      const [summary,trend,overview] = await Promise.all([

        api(`/api/analytics?type=summary&year=${y}&month=${m}`),

        api('/api/analytics?type=trend'),

        api(`/api/analytics?type=overview&year=${y}&month=${m}`)

      ]);

      render(
        Array.isArray(summary) ? summary : [],
        trend || {},
        overview || {}
      );

    }catch(error){

      console.error('Analytics loading error:',error);

      document.getElementById('main').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">⚠️</div>
          <div>Unable to load analytics.</div>
          <div>Please refresh and try again.</div>
        </div>
      `;

    }

  }


  function render(cats,trend,ov){

    const activeCats = cats.filter(c=>Number(c.totalSpent || 0)>0);

    const maxSpent = activeCats.reduce(
      (mx,c)=>Math.max(mx,Number(c.totalSpent || 0)),0
    );

    const topCat = activeCats[0];

    const total = activeCats.reduce(
      (sum,c)=>sum+Number(c.totalSpent || 0),0
    );

    const percentUsed = Number(ov.percentUsed || 0);

    document.getElementById('main').innerHTML = `

      <div class="insights-grid">

        <div class="insight-card i1">
          <div class="insight-label">Top Category</div>
          <div class="insight-val" style="color:var(--accent)">
            ${topCat ? escapeHTML(topCat.name) : '—'}
          </div>
          <div class="insight-sub">
            ${topCat ? fmt(topCat.totalSpent)+' spent' : 'No spending yet'}
          </div>
        </div>

        <div class="insight-card i2">
          <div class="insight-label">Budget Utilization</div>
          <div class="insight-val" style="color:${percentUsed>100?'var(--red)':'var(--green)'}">
            ${percentUsed}%
          </div>
          <div class="insight-sub">
            ${fmt(ov.monthlyTotal)} of ${fmt(ov.monthlyBudget)}
          </div>
        </div>

        <div class="insight-card i3">
          <div class="insight-label">Active Categories</div>
          <div class="insight-val" style="color:var(--gold)">
            ${activeCats.length}
          </div>
          <div class="insight-sub">
            out of ${cats.length} total
          </div>
        </div>

      </div>


      <div class="charts-full">

        <div class="chart-card">
          <div class="chart-title">12-Month Spending Trend</div>
          <div class="chart-wrap chart-tall">
            <canvas id="trendC"></canvas>
          </div>
        </div>

        <div class="chart-card">
          <div class="chart-title">Category Distribution</div>
          <div class="chart-wrap">
            ${activeCats.length
              ? '<canvas id="donutC"></canvas>'
              : '<div class="empty-state"><div class="empty-icon">🍩</div>No category spending data</div>'
            }
          </div>
        </div>

      </div>


      <div class="charts-full">

        <div class="chart-card">
          <div class="chart-title">Category-wise Spending</div>
          <div class="chart-wrap">
            ${activeCats.length
              ? '<canvas id="barC"></canvas>'
              : '<div class="empty-state"><div class="empty-icon">📊</div>No spending data available</div>'
            }
          </div>
        </div>

        <div class="chart-card">
          <div class="chart-title">Spend Breakdown</div>
          <div class="cat-list" id="catList"></div>
        </div>

      </div>

    `;


    // Spending trend chart

    const trendCanvas = document.getElementById('trendC');

    if(trendCanvas){

      trendChart = new Chart(trendCanvas,{

        type:'line',

        data:{
          labels:trend.labels || [],
          datasets:[{
            label:'Spending',
            data:trend.values || [],
            borderColor:'#00d4ff',
            backgroundColor:'rgba(0,212,255,.08)',
            fill:true,
            tension:.4,
            borderWidth:2.5,
            pointBackgroundColor:'#00d4ff',
            pointRadius:4,
            pointHoverRadius:7
          }]
        },

        options:{
          responsive:true,
          maintainAspectRatio:false,

          plugins:{
            legend:{display:false},

            tooltip:{
              callbacks:{
                label:v=>' '+fmt(v.raw)
              }
            }
          },

          scales:{
            x:{
              grid:{color:'rgba(255,255,255,.04)'},
              ticks:{
                color:'#5a7a8a',
                font:{size:10}
              }
            },

            y:{
              beginAtZero:true,
              grid:{color:'rgba(255,255,255,.04)'},
              ticks:{
                color:'#5a7a8a',
                font:{size:10},
                callback:v=>fmt(v)
              }
            }
          }
        }

      });

    }


    // Category distribution doughnut chart

    const donutCanvas = document.getElementById('donutC');

    if(donutCanvas && activeCats.length){

      donutChart = new Chart(donutCanvas,{

        type:'doughnut',

        data:{
          labels:activeCats.map(c=>c.name),

          datasets:[{
            data:activeCats.map(c=>Number(c.totalSpent || 0)),

            backgroundColor:activeCats.map(
              c=>safeColor(c.color)
            ),

            borderWidth:0,
            hoverOffset:10
          }]
        },

        options:{
          responsive:true,
          maintainAspectRatio:false,
          cutout:'65%',

          plugins:{
            legend:{
              position:'bottom',

              labels:{
                color:'#e8f4f8',
                font:{size:10},
                boxWidth:10,
                padding:10
              }
            },

            tooltip:{
              callbacks:{
                label:v=>`${v.label}: ${fmt(v.raw)}`
              }
            }
          }
        }

      });

    }


    // Category-wise bar chart

    const barCanvas = document.getElementById('barC');

    if(barCanvas && activeCats.length){

      barChart = new Chart(barCanvas,{

        type:'bar',

        data:{
          labels:activeCats.map(c=>c.name),

          datasets:[{
            label:'Spending',

            data:activeCats.map(c=>Number(c.totalSpent || 0)),

            backgroundColor:activeCats.map(
              c=>safeColor(c.color)+'cc'
            ),

            borderColor:activeCats.map(
              c=>safeColor(c.color)
            ),

            borderWidth:1.5,
            borderRadius:6
          }]
        },

        options:{
          responsive:true,
          maintainAspectRatio:false,

          plugins:{
            legend:{display:false},

            tooltip:{
              callbacks:{
                label:v=>' '+fmt(v.raw)
              }
            }
          },

          scales:{
            x:{
              grid:{display:false},
              ticks:{
                color:'#5a7a8a',
                font:{size:10}
              }
            },

            y:{
              beginAtZero:true,
              grid:{color:'rgba(255,255,255,.04)'},

              ticks:{
                color:'#5a7a8a',
                font:{size:10},
                callback:v=>fmt(v)
              }
            }
          }
        }

      });

    }


    // Category spending breakdown

    const list = document.getElementById('catList');

    if(list){

      if(!cats.length){

        list.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🏷️</div>
            No categories found
          </div>
        `;

      }else{

        list.innerHTML = cats.map(c=>{

          const amount = Number(c.totalSpent || 0);

          const pct = maxSpent>0
            ? (amount/maxSpent)*100
            : 0;

          const color = safeColor(c.color);

          return `

            <div class="cat-row">

              <div class="cat-row-dot"
                style="background:${color}">
              </div>

              <div class="cat-row-name">
                ${escapeHTML(c.name)}
              </div>

              <div class="cat-row-bar-wrap">
                <div class="cat-row-bar"
                  style="width:${pct}%;background:${color}">
                </div>
              </div>

              <div class="cat-row-val" style="color:${color}">
                ${fmt(amount)}
              </div>

            </div>

          `;

        }).join('');

      }

    }

  }


  function safeColor(color){

    if(typeof color === 'string' &&
       /^#[0-9a-fA-F]{6}$/.test(color)){
      return color;
    }

    return '#00d4ff';

  }


  function escapeHTML(value){

    return String(value ?? '').replace(/[&<>"']/g,char=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#39;'
    })[char]);

  }


  async function api(url){

    try{

      const response = await fetch(url);

      if(!response.ok){
        throw new Error('API request failed: '+response.status);
      }

      return await response.json();

    }catch(error){

      console.error(error);
      return {};

    }

  }


  async function logout(){

    try{
      await fetch('/api/auth?action=logout',{method:'POST'});
    }catch(error){
      console.error(error);
    }

    window.location.href='login.html';

  }


  function toggleMenu(){

    document.querySelector('.sidebar').classList.toggle('open');

    document.getElementById('menuOverlay').classList.toggle('show');

  }

</script>
